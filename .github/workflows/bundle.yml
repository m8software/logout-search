# One-folder bundles of `logout-search` (apps/search/installer/bundle/build.py): the launcher with Python, the engine,
# the installer, the update tools and the libraries inside. Built on every push and pull request so a break shows at
# once; release.yml calls this and attaches the archives to the release.
#
# Systems: Linux x86_64, Windows x86_64, macOS arm64. onnxruntime 1.30 publishes no macOS x86_64 wheel, so Intel Macs
# have no bundle; they can run the engine from source with Python 3.12.
name: bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest machine offered: the bundle carries the build machine's Python, which needs that
        # machine's C library or newer (built on 24.04 it would not start on Debian 12 or Ubuntu 22.04)
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyInstaller and the engine's libraries
        # then PyAV out again: aiortc asks for it, the bundle must not carry it (see requirements.txt)
        shell: bash
        run: |
          pip install -r apps/search/installer/bundle/requirements.txt
          pip uninstall -y av
      # Ubuntu 22.04's SQLite is 3.37: the release's place index needs 3.43 or newer (FTS5 contentless_delete), so the
      # Linux program could not search places by name and every search with a position failed (2026-11-14). The program
      # carries this one instead, built from SQLite's own source (public domain), checked against the pinned SHA-256.
      - name: Build a current SQLite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/sqlite.zip https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip
          echo "aa73d8748095808471deaa8e6f34aa700e37f2f787f4425744f53fdd15a89c40  /tmp/sqlite.zip" | sha256sum -c -
          unzip -q /tmp/sqlite.zip -d /tmp
          mkdir -p /tmp/sqlite-lib
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_MATH_FUNCTIONS \
              -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_THREADSAFE=1 -Wl,-soname,libsqlite3.so.0 \
              -o /tmp/sqlite-lib/libsqlite3.so.0 /tmp/sqlite-amalgamation-3470200/sqlite3.c -ldl -lpthread -lm
          echo "LOGOUT_SQLITE_SO=/tmp/sqlite-lib/libsqlite3.so.0" >> "$GITHUB_ENV"
      - name: Build and smoke-test the bundle
        env:
          ORT_DISABLE_TELEMETRY: "1"
        shell: bash
        # a failure's last lines are repeated as an error note, so the cause can be read from the run's summary
        run: |
          set -o pipefail
          python apps/search/installer/bundle/build.py --out dist 2>&1 | tee build.log || {
            echo "::error::$(tail -30 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
