# A tag image-<version> builds the Docker image (apps/search/docker) and publishes it to this repository's
# package registry as ghcr.io/<owner>/<repo>:<version> and :latest. It is separate from release.yml on purpose:
# a v* tag makes a program release, and an image can be rebuilt without one.
#
# The image holds the program only. The search data is downloaded by the container's first start, from the
# signed release on Hugging Face. Built for x86-64 (linux/amd64) only.
name: image

on:
  push:
    tags: ["image-*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#image-}"
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$ ]] || { echo "tag ${GITHUB_REF_NAME}: the part after image- is not a usable image tag" >&2; exit 1; }
          docker build -f apps/search/docker/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            -t "${image}:${version}" -t "${image}:latest" apps/search
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: The image starts its program
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "${IMAGE}:${VERSION}" /app/installer/logout_search.py engine --check-imports
          # no data yet counts as healthy (the first start is still downloading)
          docker run --rm --entrypoint python3 "${IMAGE}:${VERSION}" /app/docker/entrypoint.py --health
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          docker inspect --format '{{.Id}} {{.Size}}' "${IMAGE}:${VERSION}"
